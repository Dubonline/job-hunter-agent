[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "job-hunter-agent"
version = "0.1.0"
description = "Local job search and matching assistant"
requires-python = ">=3.14.10,<3.15"
dependencies = [
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "pypdf>=7,<8",
    "python-docx>=1.2,<2",
    "pyyaml>=6.0.3,<7",
    "rich>=14,<16",
    "typer>=0.20,<1",
    "websockets>=17,<18",
]

[project.scripts]
job-agent = "job_hunter.cli:app"

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/job_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["archive", ".local"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
